name: X Scheduled Post

on:
  schedule:
    # 00:00-14:00 UTC の2時間おき (JST 09:00-23:00 の8スロット)
    - cron: '0 0-14/2 * * *'
  workflow_dispatch:
    inputs:
      message:
        description: 'Message to post (optional)'
        required: false
        default: ''
      slot:
        description: 'Schedule slot number (1-8)'
        required: false
        default: ''

jobs:
  scheduled-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run scheduled post
        continue-on-error: true
        env:
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          X_EMAIL: ${{ secrets.X_EMAIL }}
          HEADLESS: 'true'
          INPUT_MESSAGE: ${{ github.event.inputs.message }}
          INPUT_SLOT: ${{ github.event.inputs.slot }}
        run: |
          if [ -n "$INPUT_MESSAGE" ]; then
            python src/main.py --message "$INPUT_MESSAGE"
          elif [ -n "$INPUT_SLOT" ]; then
            python src/main.py --slot "$INPUT_SLOT"
          else
            python src/main.py
          fi

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
